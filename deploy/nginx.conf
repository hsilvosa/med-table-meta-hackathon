# The online demo's single public port (7860): / is the 3D room server (welcome page, room, live scan), /app/ the Streamlit planner.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;
    client_max_body_size 80m;              # a 48 MP photo from the room
    absolute_redirect off;                 # behind the Space's own proxy: relative redirects only

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 7860;

        location = /app { return 301 /app/; }
        location /app/ {                   # Streamlit (--server.baseUrlPath app), with its websocket
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
        location / {                       # the room; /scan streams one JSON line per stage, so no buffering
            proxy_pass http://127.0.0.1:8600;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300;
        }
    }
}
